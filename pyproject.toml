[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditor-dados"
version = "0.1.0"
description = "Projeto exemplo para limpeza e auditoria de dados de clientes em CSV."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
auditor-dados = "auditor_dados.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
